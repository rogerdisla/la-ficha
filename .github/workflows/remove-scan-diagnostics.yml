name: Apply La Ficha no-diagnostics patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-scan-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 remove_scan_diagnostics.py
      - name: Verify exact patched blob
        run: |
          ACTUAL=$(git hash-object index.html)
          EXPECTED="cb94fad299908cf861a5ad257b57294a8996d868"
          echo "Patched blob SHA: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove scan diagnostics from La Ficha"
          git push
