name: Apply La Ficha auto-capture fix

# Final trigger for corrected production camera behavior
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-scan-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore automatic capture retry
        run: python3 fix_auto_capture.py

      - name: Verify automatic capture behavior
        shell: bash
        run: |
          grep -Fq "if(captureInProgress||autoCaptureTimer||!framingReady)return;" index.html
          grep -Fq "await new Promise(r=>setTimeout(r,260));" index.html
          ! grep -Fq "Uncertain count — tap Capture to retry" index.html
          ! grep -Fq "Fresh frame not confirmed — tap Capture" index.html
          ! grep -Fq "if(lfCaptureNeedsTap||captureInProgress||autoCaptureTimer||!framingReady)return;" index.html

      - name: Commit fixed app and clean temporary patch files
        run: |
          rm -f fix_auto_capture.py remove_scan_diagnostics.py .github/workflows/remove-scan-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore La Ficha automatic camera capture"
          git push
