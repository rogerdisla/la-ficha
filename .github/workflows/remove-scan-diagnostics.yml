name: Apply La Ficha auto-capture fix

# Trigger corrected auto-capture patch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-scan-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore automatic capture retry
        run: python3 fix_auto_capture.py

      - name: Verify exact fixed app blob
        run: |
          ACTUAL=$(git hash-object index.html)
          EXPECTED="efa4e4b92067dbfe81c4f2e0ec1211ecafd8f8f5"
          echo "Fixed blob SHA: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit fixed app and clean temporary patch files
        run: |
          rm -f fix_auto_capture.py remove_scan_diagnostics.py .github/workflows/remove-scan-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore La Ficha automatic camera capture"
          git push
